<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Pipeline — Planner → Coder → Validator</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --bg2:     #161b22;
      --bg3:     #21262d;
      --border:  #30363d;
      --text:    #c9d1d9;
      --dim:     #8b949e;
      --amber:   #f59e0b;
      --cyan:    #06b6d4;
      --emerald: #10b981;
      --red:     #f87171;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px;
      height: 100%;
    }

    #root { height: 100%; display: flex; flex-direction: column; }

    /* ── API bar ── */
    .api-bar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .api-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--dim);
      white-space: nowrap;
    }
    .api-input {
      width: 340px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: 5px 10px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      outline: none;
    }
    .api-input:focus { border-color: var(--cyan); }
    .api-status {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .api-status.ok  { background: rgba(16,185,129,.12); color: var(--emerald); }
    .api-status.bad { background: rgba(248,113,113,.12); color: var(--red); }
    .api-title {
      margin-left: auto;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: .03em;
    }
    .model-select {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      padding: 5px 8px;
      font-size: 11px;
      outline: none;
      cursor: pointer;
    }
    .model-select:focus { border-color: var(--cyan); }

    /* ── Pipeline bar ── */
    .pipeline-bar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      gap: 4px;
    }
    .stage-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 18px;
      border-radius: 20px;
      border: 1.5px solid transparent;
      font-size: 12px;
      font-weight: 600;
      transition: all .25s ease;
      user-select: none;
    }
    .stage-pill.planner   { border-color: rgba(245,158,11,.2);  color: rgba(245,158,11,.45); }
    .stage-pill.coder     { border-color: rgba(6,182,212,.2);   color: rgba(6,182,212,.45); }
    .stage-pill.validator { border-color: rgba(16,185,129,.2);  color: rgba(16,185,129,.45); }
    .stage-pill.active.planner   { border-color: var(--amber);   color: var(--amber);   background: rgba(245,158,11,.1);  box-shadow: 0 0 14px rgba(245,158,11,.25); }
    .stage-pill.active.coder     { border-color: var(--cyan);    color: var(--cyan);    background: rgba(6,182,212,.1);   box-shadow: 0 0 14px rgba(6,182,212,.25); }
    .stage-pill.active.validator { border-color: var(--emerald); color: var(--emerald); background: rgba(16,185,129,.1);  box-shadow: 0 0 14px rgba(16,185,129,.25); }
    .p-arrow {
      font-size: 16px;
      padding: 0 8px;
      color: var(--dim);
      transition: all .25s ease;
    }
    .p-arrow.glow-amber   { color: var(--amber);   text-shadow: 0 0 8px var(--amber); }
    .p-arrow.glow-cyan    { color: var(--cyan);    text-shadow: 0 0 8px var(--cyan); }

    /* ── Panels ── */
    .panels {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      border-right: 1px solid var(--border);
      overflow: hidden;
      transition: box-shadow .3s ease;
    }
    .panel:last-child { border-right: none; }
    .panel.glow-planner   { box-shadow: inset 2px 0 0 rgba(245,158,11,.4),  inset -2px 0 0 rgba(245,158,11,.4); }
    .panel.glow-coder     { box-shadow: inset 2px 0 0 rgba(6,182,212,.4),   inset -2px 0 0 rgba(6,182,212,.4); }
    .panel.glow-validator { box-shadow: inset 2px 0 0 rgba(16,185,129,.4),  inset -2px 0 0 rgba(16,185,129,.4); }

    /* ── Panel header ── */
    .ph {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg2);
      flex-shrink: 0;
      border-bottom: 2px solid;
    }
    .ph.planner   { border-color: var(--amber); }
    .ph.coder     { border-color: var(--cyan); }
    .ph.validator { border-color: var(--emerald); }

    .agent-badge { display: flex; align-items: center; gap: 9px; }
    .agent-icon  { font-size: 18px; line-height: 1; }
    .agent-name  { font-size: 13px; font-weight: 700; }
    .agent-name.planner   { color: var(--amber); }
    .agent-name.coder     { color: var(--cyan); }
    .agent-name.validator { color: var(--emerald); }
    .agent-role  { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .07em; margin-top: 1px; }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--dim);
      padding: 3px 9px;
      font-size: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .clear-btn:hover { border-color: var(--dim); color: var(--text); }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg { display: flex; flex-direction: column; gap: 3px; animation: fadein .25s ease; }
    @keyframes fadein { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }

    .msg-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .msg-label.user     { color: var(--dim); }
    .msg-label.planner  { color: var(--amber); }
    .msg-label.coder    { color: var(--cyan); }
    .msg-label.validator{ color: var(--emerald); }
    .msg-label.error    { color: var(--red); }

    .msg-bubble {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 13px;
      line-height: 1.65;
      word-break: break-word;
    }
    .msg-bubble.user    { background: var(--bg2); border-left: 3px solid var(--dim); }
    .msg-bubble.planner { border-left: 3px solid var(--amber); }
    .msg-bubble.coder   { border-left: 3px solid var(--cyan); }
    .msg-bubble.validator{ border-left: 3px solid var(--emerald); }
    .msg-bubble.error   { border-left: 3px solid var(--red); color: var(--red); font-family: 'Fira Code', monospace; font-size: 11px; }

    /* Markdown inside bubbles */
    .md-content h1, .md-content h2, .md-content h3, .md-content h4 {
      margin: 10px 0 4px; font-weight: 700; color: #e6edf3; line-height: 1.3;
    }
    .md-content h1 { font-size: 14px; }
    .md-content h2 { font-size: 13px; }
    .md-content h3 { font-size: 12px; color: var(--dim); }
    .md-content h4 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
    .md-content p  { margin: 5px 0; }
    .md-content ul, .md-content ol { padding-left: 18px; margin: 5px 0; }
    .md-content li { margin: 2px 0; }
    .md-content strong { color: #e6edf3; font-weight: 600; }
    .md-content em     { color: var(--dim); font-style: italic; }
    .md-content a      { color: var(--cyan); text-decoration: none; }
    .md-content a:hover{ text-decoration: underline; }
    .md-content blockquote {
      border-left: 3px solid var(--border);
      padding-left: 10px;
      color: var(--dim);
      margin: 5px 0;
    }
    .md-content code {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      background: rgba(255,255,255,.06);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .md-content pre {
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 11px 13px;
      overflow-x: auto;
      margin: 7px 0;
    }
    .md-content pre code {
      background: transparent;
      padding: 0;
      font-size: 11px;
      color: #e6edf3;
      line-height: 1.55;
    }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .md-content table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 11px; }
    .md-content th, .md-content td { border: 1px solid var(--border); padding: 4px 8px; }
    .md-content th { background: var(--bg2); font-weight: 600; }

    /* Forward button */
    .fwd-wrap { display: flex; justify-content: flex-end; margin-top: 4px; }
    .fwd-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 13px; border-radius: 5px;
      font-size: 11px; font-weight: 600; cursor: pointer;
      border: 1px solid transparent; font-family: inherit;
      transition: all .2s;
    }
    .fwd-btn.to-coder {
      background: rgba(6,182,212,.12); color: var(--cyan); border-color: rgba(6,182,212,.3);
    }
    .fwd-btn.to-coder:hover { background: rgba(6,182,212,.22); box-shadow: 0 0 10px rgba(6,182,212,.2); }
    .fwd-btn.to-validator {
      background: rgba(16,185,129,.12); color: var(--emerald); border-color: rgba(16,185,129,.3);
    }
    .fwd-btn.to-validator:hover { background: rgba(16,185,129,.22); box-shadow: 0 0 10px rgba(16,185,129,.2); }

    /* Loading */
    .loading-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 13px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 7px;
    }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      animation: blink 1.3s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    .dot.planner   { background: var(--amber); }
    .dot.coder     { background: var(--cyan); }
    .dot.validator { background: var(--emerald); }
    @keyframes blink { 0%,80%,100%{opacity:.25;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
    .loading-lbl { font-size: 11px; color: var(--dim); }

    /* Empty state */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 7px; color: var(--dim); padding: 20px; text-align: center;
    }
    .empty-icon  { font-size: 28px; opacity: .3; }
    .empty-title { font-size: 12px; font-weight: 600; }
    .empty-desc  { font-size: 10px; max-width: 180px; line-height: 1.5; }

    /* Footer */
    .panel-foot {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 10px 12px 8px;
      display: flex; flex-direction: column; gap: 6px;
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 7px; align-items: flex-end; }
    .ptextarea {
      flex: 1; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); padding: 7px 11px;
      font-size: 12px; font-family: 'Inter', sans-serif;
      resize: none; outline: none; min-height: 54px; max-height: 110px;
      line-height: 1.5; transition: border-color .15s;
    }
    .ptextarea::placeholder { color: var(--dim); }
    .ptextarea.planner:focus   { border-color: var(--amber); }
    .ptextarea.coder:focus     { border-color: var(--cyan); }
    .ptextarea.validator:focus { border-color: var(--emerald); }
    .ptextarea:disabled        { opacity: .5; cursor: not-allowed; }
    .send-btn {
      padding: 7px 15px; border-radius: 5px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      border: none; font-family: inherit; transition: all .15s;
      align-self: flex-end; white-space: nowrap;
    }
    .send-btn.planner   { background: var(--amber);   color: #0d1117; }
    .send-btn.coder     { background: var(--cyan);    color: #0d1117; }
    .send-btn.validator { background: var(--emerald); color: #0d1117; }
    .send-btn:hover:not(:disabled) { filter: brightness(1.1); }
    .send-btn:disabled  { opacity: .4; cursor: not-allowed; }
    .foot-hint { font-size: 9px; color: var(--dim); text-align: right; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useRef, useEffect } = React;

  /* ── Agent definitions ── */
  const AGENTS = [
    {
      id: 'planner', name: 'Planner', icon: '🧠',
      cc: 'planner', fwdClass: 'to-coder', fwdLabel: 'Send to Coder →',
      nextId: 'coder', role: 'Architecture & Planning',
      placeholder: 'Describe a feature to plan…',
      systemPrompt:
`You are a Senior Software Architect and Planning Agent for the frappe/agent repository. You NEVER write code. You only produce structured implementation plans. Always output plans using this exact format:

## 📋 Plan: <Feature Name>
### Summary
### Repo Layer Affected
### Sync or Async? (justify)
### Job Steps (if async)
### Files to Create / Modify
### Implementation Task List (ordered)
### Risk & Edge Cases
### Anti-patterns to Avoid`,
    },
    {
      id: 'coder', name: 'Coder', icon: '💻',
      cc: 'coder', fwdClass: 'to-validator', fwdLabel: 'Send to Validator →',
      nextId: 'validator', role: 'Python Implementation',
      placeholder: 'Paste a plan to implement…',
      systemPrompt:
`You are a Senior Python Developer Agent for the frappe/agent repository. You receive plans from the Planner and write production-ready Python code that matches the repo patterns exactly. Always output using this exact format:

## 🛠️ Implementation: <Task Name>
### Files Modified / Created
### Code (one block per file)
### Usage Example
### Test Command
### ✅ Review Checklist for Validator`,
    },
    {
      id: 'validator', name: 'Validator', icon: '🔍',
      cc: 'validator', fwdClass: null, fwdLabel: null,
      nextId: null, role: 'Code Quality Review',
      placeholder: 'Paste code to validate…',
      systemPrompt:
`You are a Code Quality Validator Agent for the frappe/agent repository. You receive code from the Coder and validate it. Check for: repo pattern compliance, code quality, redundancy, dead code, security issues, and idempotency. Output a structured report with ERROR / WARNING / INFO severity per issue, a summary, and an overall code health score 0–100.`,
    },
  ];

  const MODELS = [
    { id: 'claude-sonnet-4-6',           label: 'Sonnet 4.6' },
    { id: 'claude-opus-4-5',             label: 'Opus 4.5' },
    { id: 'claude-haiku-4-5-20251001',   label: 'Haiku 4.5' },
  ];

  /* ── Helpers ── */
  function md(text) {
    if (typeof marked === 'undefined') {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }
    try { return marked.parse(text, { gfm: true, breaks: false }); }
    catch { return '<pre>' + text + '</pre>'; }
  }

  /* ── Components ── */
  function LoadingDots({ cc }) {
    return (
      <div className="loading-row">
        <div className="dots">
          <div className={`dot ${cc}`}/><div className={`dot ${cc}`}/><div className={`dot ${cc}`}/>
        </div>
        <span className="loading-lbl">Thinking…</span>
      </div>
    );
  }

  function Message({ msg, agent, isLast, onForward }) {
    const isUser = msg.role === 'user';
    const isError = msg.role === 'error';
    const isAsst = msg.role === 'assistant';
    const labelCls = isUser ? 'user' : isError ? 'error' : agent.cc;
    const bubbleCls = isUser ? 'user' : isError ? 'error' : agent.cc;
    const label = isUser ? 'You' : isError ? '⚠ Error' : `${agent.icon} ${agent.name}`;
    return (
      <div className="msg">
        <div className={`msg-label ${labelCls}`}>{label}</div>
        <div className={`msg-bubble ${bubbleCls}`}>
          {isUser || isError
            ? <span style={{ whiteSpace: 'pre-wrap' }}>{msg.content}</span>
            : <div className="md-content" dangerouslySetInnerHTML={{ __html: md(msg.content) }}/>
          }
        </div>
        {isAsst && isLast && agent.fwdLabel && (
          <div className="fwd-wrap">
            <button className={`fwd-btn ${agent.fwdClass}`} onClick={() => onForward(msg.content)}>
              {agent.fwdLabel}
            </button>
          </div>
        )}
      </div>
    );
  }

  function AgentPanel({ agent, messages, input, loading, onInput, onSend, onClear, onForward, isActive }) {
    const taRef  = useRef(null);
    const endRef = useRef(null);

    useEffect(() => {
      endRef.current?.scrollIntoView({ behavior: 'smooth' });
    }, [messages.length, loading]);

    useEffect(() => {
      const ta = taRef.current;
      if (!ta) return;
      ta.style.height = 'auto';
      ta.style.height = Math.min(ta.scrollHeight, 110) + 'px';
    }, [input]);

    const keyDown = e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onSend(); }
    };

    const isEmpty = messages.length === 0 && !loading;

    return (
      <div className={`panel ${isActive ? `glow-${agent.cc}` : ''}`}>
        {/* Header */}
        <div className={`ph ${agent.cc}`}>
          <div className="agent-badge">
            <span className="agent-icon">{agent.icon}</span>
            <div>
              <div className={`agent-name ${agent.cc}`}>{agent.name}</div>
              <div className="agent-role">{agent.role}</div>
            </div>
          </div>
          <button className="clear-btn" onClick={onClear}>Clear</button>
        </div>

        {/* Messages */}
        <div className="messages">
          {isEmpty ? (
            <div className="empty">
              <div className="empty-icon">{agent.icon}</div>
              <div className="empty-title">{agent.name} ready</div>
              <div className="empty-desc">{agent.placeholder}</div>
            </div>
          ) : (
            <>
              {messages.map((msg, i) => (
                <Message
                  key={i}
                  msg={msg}
                  agent={agent}
                  isLast={i === messages.length - 1}
                  onForward={onForward}
                />
              ))}
              {loading && <LoadingDots cc={agent.cc}/>}
            </>
          )}
          <div ref={endRef}/>
        </div>

        {/* Footer */}
        <div className="panel-foot">
          <div className="input-row">
            <textarea
              ref={taRef}
              className={`ptextarea ${agent.cc}`}
              value={input}
              onChange={e => onInput(e.target.value)}
              onKeyDown={keyDown}
              placeholder={agent.placeholder}
              disabled={loading}
              rows={2}
            />
            <button
              className={`send-btn ${agent.cc}`}
              onClick={onSend}
              disabled={loading || !input.trim()}
            >Send</button>
          </div>
          <div className="foot-hint">⌘/Ctrl+Enter to send</div>
        </div>
      </div>
    );
  }

  /* ── App ── */
  function App() {
    const [apiKey, setApiKey] = useState(() => {
      try { return localStorage.getItem('fpipe_apikey') || ''; } catch { return ''; }
    });
    const [model, setModel] = useState(() => {
      try { return localStorage.getItem('fpipe_model') || MODELS[0].id; } catch { return MODELS[0].id; }
    });

    const initState = () => ({
      planner:   { messages: [], input: '', loading: false },
      coder:     { messages: [], input: '', loading: false },
      validator: { messages: [], input: '', loading: false },
    });
    const [states, setStates] = useState(initState);
    const [active, setActive] = useState(null);

    const saveKey = v => {
      setApiKey(v);
      try { localStorage.setItem('fpipe_apikey', v); } catch {}
    };
    const saveModel = v => {
      setModel(v);
      try { localStorage.setItem('fpipe_model', v); } catch {}
    };

    const setInput = (id, val) =>
      setStates(p => ({ ...p, [id]: { ...p[id], input: val } }));

    const clearPanel = id =>
      setStates(p => ({ ...p, [id]: { messages: [], input: '', loading: false } }));

    const send = async (id) => {
      const agent = AGENTS.find(a => a.id === id);
      const s = states[id];
      const text = s.input.trim();
      if (!text || s.loading) return;

      /* No API key check */
      if (!apiKey.trim()) {
        setStates(p => ({
          ...p, [id]: {
            ...p[id],
            messages: [...p[id].messages,
              { role: 'user', content: text },
              { role: 'error', content: 'API key required. Enter your Anthropic key in the bar above.' }
            ],
            input: '',
          }
        }));
        return;
      }

      const msgs = [...s.messages, { role: 'user', content: text }];
      setStates(p => ({ ...p, [id]: { ...p[id], messages: msgs, input: '', loading: true } }));
      setActive(id);

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey.trim(),
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model,
            max_tokens: 4000,
            system: agent.systemPrompt,
            messages: msgs,
          }),
        });

        let data;
        try { data = await res.json(); } catch { throw new Error(`HTTP ${res.status} (invalid JSON)`); }
        if (!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);

        const reply = data.content?.[0]?.text ?? '(empty response)';
        setStates(p => ({
          ...p, [id]: {
            ...p[id],
            messages: [...msgs, { role: 'assistant', content: reply }],
            loading: false,
          }
        }));
      } catch (err) {
        setStates(p => ({
          ...p, [id]: {
            ...p[id],
            messages: [...msgs, { role: 'error', content: err.message }],
            loading: false,
          }
        }));
      }
    };

    const forward = (fromId, content) => {
      const agent = AGENTS.find(a => a.id === fromId);
      if (!agent.nextId) return;
      setStates(p => ({ ...p, [agent.nextId]: { ...p[agent.nextId], input: content } }));
    };

    /* Pipeline arrow glow logic:
       arrow[0] (planner→coder):     glow when planner is active
       arrow[1] (coder→validator):   glow when coder is active */
    const arrowGlow = ['glow-amber', 'glow-cyan'];

    return (
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>

        {/* API bar */}
        <div className="api-bar">
          <span className="api-label">API Key</span>
          <input
            type="password"
            className="api-input"
            value={apiKey}
            onChange={e => saveKey(e.target.value)}
            placeholder="sk-ant-…"
          />
          <span className={`api-status ${apiKey.trim() ? 'ok' : 'bad'}`}>
            {apiKey.trim() ? '● Ready' : '○ No key'}
          </span>
          <span className="api-label" style={{ marginLeft: 16 }}>Model</span>
          <select className="model-select" value={model} onChange={e => saveModel(e.target.value)}>
            {MODELS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
          <span className="api-title">Frappe Agent Pipeline</span>
        </div>

        {/* Pipeline bar */}
        <div className="pipeline-bar">
          {AGENTS.map((ag, i) => (
            <React.Fragment key={ag.id}>
              <div className={`stage-pill ${ag.cc} ${active === ag.id ? 'active' : ''}`}>
                <span>{ag.icon}</span><span>{ag.name}</span>
              </div>
              {i < AGENTS.length - 1 && (
                <div className={`p-arrow ${active === ag.id ? arrowGlow[i] : ''}`}>→</div>
              )}
            </React.Fragment>
          ))}
        </div>

        {/* Agent panels */}
        <div className="panels">
          {AGENTS.map(ag => (
            <AgentPanel
              key={ag.id}
              agent={ag}
              messages={states[ag.id].messages}
              input={states[ag.id].input}
              loading={states[ag.id].loading}
              onInput={v => setInput(ag.id, v)}
              onSend={() => send(ag.id)}
              onClear={() => clearPanel(ag.id)}
              onForward={content => forward(ag.id, content)}
              isActive={active === ag.id}
            />
          ))}
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
