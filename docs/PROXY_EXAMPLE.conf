proxy_cache_path /tmp/cache keys_zone=proxy_cache_zone:10m loader_threshold=300 loader_files=200 max_size=200m;


#
#
# amplify_host is used to forward requests to the Amplify UI, which is running on a different server. This allows us to keep the Amplify UI separate from the main application, and also allows us to use a different SSL certificate for the Amplify UI if needed.
#
#
#


server {
	listen 443 http2 ssl;
	server_name fe-decoupling.mazeed.cloud;

	ssl_certificate /home/frappe/agent/nginx/hosts/*.mazeed.cloud/fullchain.pem;
	ssl_certificate_key /home/frappe/agent/nginx/hosts/*.mazeed.cloud/privkey.pem;
	ssl_trusted_certificate /home/frappe/agent/nginx/hosts/*.mazeed.cloud/chain.pem;

	ssl_session_timeout 1d;
	ssl_session_cache shared:MozSSL:10m; # about 40000 sessions
	ssl_session_tickets off;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
	ssl_prefer_server_ciphers off;

	ssl_stapling on;
	ssl_stapling_verify on;

	resolver 8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1 208.67.222.222 208.67.220.220 valid=600s;
	resolver_timeout 30s;

	client_max_body_size 250M;
	client_body_buffer_size 16K;
	client_header_buffer_size 1k;

	more_set_headers "X-Frame-Options: SAMEORIGIN";
	more_set_headers "X-XSS-Protection: 1; mode=block";
	more_set_headers "X-Content-Type-Options: nosniff";
	more_set_headers "Referrer-Policy: no-referrer-when-downgrade";
	more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
	#more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
	more_set_headers "Content-Security-Policy: default-src 'self'";

	location /api/ {
		proxy_http_version 1.1;
		proxy_read_timeout 600;
		proxy_buffering off;
		proxy_buffer_size 8k;
		proxy_buffers 8 8k;
		proxy_busy_buffers_size 8k;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Mazeed-Site-Name https://$host;
		proxy_set_header Connection "";

		more_set_headers "X-Proxy-Upstream: $upstream_server_hash";
		more_set_headers "Access-Control-Allow-Origin: $access_control_allow_origin";
		more_set_headers "Access-Control-Allow-Headers: $access_control_allow_headers";
		more_set_headers "Access-Control-Allow-Credentials: $access_control_allow_credentials";
		more_set_headers "Access-Control-Allow-Methods: $access_control_allow_methods";

		proxy_pass $upstream_server_hash;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Mazeed-Site-Name https://$host;
		proxy_set_header Connection "upgrade";

		more_set_headers "X-Proxy-Upstream: $socket_upstream_hash";

		proxy_pass $socket_upstream_hash;
	}

	location / {
		set $amplify_host devmazeedfe.mazeed.cloud;

		proxy_http_version 1.1;
		proxy_read_timeout 600;
		proxy_ssl_server_name on;
		proxy_set_header Host $amplify_host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Mazeed-Site-Name https://$host;
		proxy_set_header Connection "";

		more_set_headers "X-Proxy-Upstream: https://$amplify_host";

		proxy_pass https://$amplify_host;
	}

	proxy_intercept_errors on;
	error_page 429 /exceeded.html;
	location /exceeded.html {
		root /home/frappe/agent/repo/agent/pages;
		internal;
	}
}

